name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  linux-and-openwrt:
    name: ${{ matrix.asset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: linux-x86_64
            target: x86_64-unknown-linux-musl
            rustflags: ""
            openwrt_arch: ""
          - asset: linux-arm64
            target: aarch64-unknown-linux-musl
            rustflags: ""
            openwrt_arch: ""
          - asset: openwrt-x86_64
            target: x86_64-unknown-linux-musl
            rustflags: "-C target-cpu=x86-64"
            openwrt_arch: x86_64
          - asset: openwrt-aarch64_cortex-a53
            target: aarch64-unknown-linux-musl
            rustflags: "-C target-cpu=cortex-a53"
            openwrt_arch: aarch64_cortex-a53
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.1
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --version 0.23.0 --locked
      - name: Build static binary
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}
      - name: Verify static executable
        run: |
          file target/${{ matrix.target }}/release/qin
          if readelf -l target/${{ matrix.target }}/release/qin | grep -q 'Requesting program interpreter'; then
            echo "The Linux/OpenWrt release executable is dynamically linked" >&2
            exit 1
          fi
      - name: Package archive
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          sh scripts/package-release.sh \
            target/${{ matrix.target }}/release/qin \
            qin-v${version}-${{ matrix.asset }} \
            dist
      - name: Package OpenWrt ipk
        if: matrix.openwrt_arch != ''
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          sh scripts/package-openwrt.sh \
            target/${{ matrix.target }}/release/qin \
            "${{ matrix.openwrt_arch }}" \
            "$version" \
            dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qin-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  macos:
    name: ${{ matrix.asset }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: macos-x86_64
            target: x86_64-apple-darwin
          - asset: macos-arm64
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build executable
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Verify executable architecture
        run: file target/${{ matrix.target }}/release/qin
      - name: Package archive
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          sh scripts/package-release.sh \
            target/${{ matrix.target }}/release/qin \
            qin-v${version}-${{ matrix.asset }} \
            dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qin-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-and-openwrt, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Validate version and create checksums
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          test "v${version}" = "$GITHUB_REF_NAME"
          cd release-assets
          sha256sum qin-* > SHA256SUMS
          ls -lh
      - name: Create release notes
        run: |
          version=${GITHUB_REF_NAME#v}
          {
            echo "Prebuilt qin ${version} executables for Linux, macOS, and OpenWrt."
            echo
            echo "OpenWrt assets include both a portable archive and an opkg-compatible .ipk package. Linux and OpenWrt executables are statically linked with musl. Verify downloads with SHA256SUMS."
            echo
            awk -v version="$version" '
              $0 == "## " version { found=1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md
          } > release-notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "qin $GITHUB_REF_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              release-assets/* \
              --verify-tag \
              --title "qin $GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi
