name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  linux:
    name: ${{ matrix.asset }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: linux-x86_64
            target: x86_64-unknown-linux-musl
          - asset: linux-arm64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.1
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --version 0.23.0 --locked
      - name: Build static binary
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}
      - name: Verify static executable
        run: |
          file target/${{ matrix.target }}/release/qin
          if readelf -l target/${{ matrix.target }}/release/qin | grep -q 'Requesting program interpreter'; then
            echo "The Linux/OpenWrt release executable is dynamically linked" >&2
            exit 1
          fi
      - name: Package archive
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          sh scripts/package-release.sh \
            target/${{ matrix.target }}/release/qin \
            qin-v${version}-${{ matrix.asset }} \
            dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qin-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  openwrt:
    name: ${{ matrix.asset }} (OpenWrt 25.12.5 SDK)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: openwrt-x86_64
            target: x86_64-unknown-linux-musl
            rustflags: "-C target-cpu=x86-64"
            openwrt_arch: x86_64
            sdk_path: x86/64
            sdk_file: openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            sdk_sha256: 0c8df0151a1e88feb7c03d694d61f6a18d51872815b7c811d76e2b77504d5e9c
          - asset: openwrt-aarch64_cortex-a53
            target: aarch64-unknown-linux-musl
            rustflags: "-C target-cpu=cortex-a53"
            openwrt_arch: aarch64_cortex-a53
            sdk_path: mvebu/cortexa53
            sdk_file: openwrt-sdk-25.12.5-mvebu-cortexa53_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            sdk_sha256: 25b81b6871ed2b42db45248c4ccb8ce6fc0bd1a402df1dab1b54380a537ab556
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install SDK extraction dependency
        run: sudo apt-get update && sudo apt-get install --yes zstd
      - name: Download and verify OpenWrt 25.12.5 SDK
        env:
          SDK_PATH: ${{ matrix.sdk_path }}
          SDK_FILE: ${{ matrix.sdk_file }}
          SDK_SHA256: ${{ matrix.sdk_sha256 }}
        run: |
          curl --fail --location --retry 5 --output "$RUNNER_TEMP/openwrt-sdk.tar.zst" \
            "https://downloads.openwrt.org/releases/25.12.5/targets/${SDK_PATH}/${SDK_FILE}"
          echo "${SDK_SHA256}  $RUNNER_TEMP/openwrt-sdk.tar.zst" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/openwrt-sdk"
          tar --use-compress-program=unzstd \
            --extract --file "$RUNNER_TEMP/openwrt-sdk.tar.zst" \
            --directory "$RUNNER_TEMP/openwrt-sdk" --strip-components=1
          echo "OPENWRT_SDK=$RUNNER_TEMP/openwrt-sdk" >> "$GITHUB_ENV"
      - name: Build with the OpenWrt SDK toolchain
        env:
          RUST_TARGET: ${{ matrix.target }}
          TARGET_RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          cc=$(find "$OPENWRT_SDK/staging_dir" -path '*/bin/*-openwrt-linux-musl-gcc' -print -quit)
          test -n "$cc" && test -x "$cc"
          ar=${cc%gcc}ar
          test -x "$ar"
          target_env=${RUST_TARGET//-/_}
          cargo_env=${RUST_TARGET^^}
          cargo_env=${cargo_env//-/_}
          export "CC_${target_env}=$cc"
          export "AR_${target_env}=$ar"
          export "CARGO_TARGET_${cargo_env}_LINKER=$cc"
          export "CARGO_TARGET_${cargo_env}_RUSTFLAGS=$TARGET_RUSTFLAGS"
          cargo build --release --locked --target "$RUST_TARGET"
      - name: Verify static executable
        run: |
          file target/${{ matrix.target }}/release/qin
          if readelf -l target/${{ matrix.target }}/release/qin | grep -q 'Requesting program interpreter'; then
            echo "The OpenWrt release executable is dynamically linked" >&2
            exit 1
          fi
      - name: Package archive and legacy ipk
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          sh scripts/package-release.sh \
            target/${{ matrix.target }}/release/qin \
            qin-v${version}-${{ matrix.asset }} \
            dist
          sh scripts/package-openwrt.sh \
            target/${{ matrix.target }}/release/qin \
            "${{ matrix.openwrt_arch }}" \
            "$version" \
            dist
      - name: Build native OpenWrt 25.12.5 apk package
        env:
          OPENWRT_ARCH: ${{ matrix.openwrt_arch }}
          RUST_TARGET: ${{ matrix.target }}
        run: |
          package_dir="$OPENWRT_SDK/package/qin"
          mkdir -p "$package_dir/files"
          cp packaging/openwrt/Makefile "$package_dir/Makefile"
          cp packaging/openwrt/files/config.toml.example "$package_dir/files/config.toml.example"
          cp target/${RUST_TARGET}/release/qin "$package_dir/files/qin"
          echo 'CONFIG_PACKAGE_qin=m' >> "$OPENWRT_SDK/.config"
          make --directory "$OPENWRT_SDK" defconfig
          make --directory "$OPENWRT_SDK" package/qin/compile V=s
          apk=$(find "$OPENWRT_SDK/bin/packages" -type f -name 'qin-*.apk' -print -quit)
          test -n "$apk" && test -s "$apk"
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          output="dist/qin-${version}-r1_openwrt-25.12.5_${OPENWRT_ARCH}.apk"
          cp "$apk" "$output"
          apk_tool=$(find "$OPENWRT_SDK/staging_dir/host/bin" -name apk -print -quit)
          test -n "$apk_tool" && test -x "$apk_tool"
          "$apk_tool" adbdump "$output"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qin-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  macos:
    name: ${{ matrix.asset }}
    runs-on: macos-14
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: macos-x86_64
            target: x86_64-apple-darwin
          - asset: macos-arm64
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build executable
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Verify executable architecture
        run: file target/${{ matrix.target }}/release/qin
      - name: Package archive
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          sh scripts/package-release.sh \
            target/${{ matrix.target }}/release/qin \
            qin-v${version}-${{ matrix.asset }} \
            dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qin-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, openwrt, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --format json --override-filename qin-release-sbom
          sbom=$(find . -maxdepth 1 -name 'qin-release-sbom*.json' -print -quit)
          test -n "$sbom" && test -s "$sbom"
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          cp "$sbom" "release-assets/qin-v${version}-sbom.cdx.json"
      - name: Validate version and create checksums
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          test "v${version}" = "$GITHUB_REF_NAME"
          cd release-assets
          expected=$(find . -maxdepth 1 -type f \( -name 'qin-*' -o -name 'qin_*' \) | wc -l)
          # 4 portable archives + 2 legacy ipk + 2 apk + 1 SBOM; grow this floor with new assets.
          test "$expected" -ge 9
          find . -maxdepth 1 -type f \( -name 'qin-*' -o -name 'qin_*' \) -print0 \
            | sort --zero-terminated \
            | xargs --null sha256sum \
            | sed 's#  \./#  #' > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq "$expected"
          ls -lh
      - name: Sign SHA256SUMS with minisign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install --yes minisign
          test -n "$MINISIGN_SECRET_KEY"
          install -m 0600 /dev/null "$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          cd release-assets
          printf '%s\n' "$MINISIGN_PASSWORD" \
            | minisign -S -s "$RUNNER_TEMP/minisign.key" -m SHA256SUMS -x SHA256SUMS.minisig \
                -t "qin $GITHUB_REF_NAME SHA256SUMS"
          rm -f "$RUNNER_TEMP/minisign.key"
          test -s SHA256SUMS.minisig
          grep -q '^trusted comment: ' SHA256SUMS.minisig
      - name: Create release notes
        run: |
          version=${GITHUB_REF_NAME#v}
          {
            echo "Prebuilt qin ${version} executables for Linux, macOS, and OpenWrt."
            echo
            echo "OpenWrt assets include a portable archive, a legacy opkg-compatible .ipk package, and an OpenWrt 25.12.5 SDK-built apk v3 package. Linux and OpenWrt executables are statically linked with musl. Verify downloads with SHA256SUMS, which is minisign-signed (SHA256SUMS.minisig); every asset also carries a GitHub build-provenance attestation, and a CycloneDX SBOM is attached."
            echo
            awk -v version="$version" '
              $0 == "## " version { found=1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md
          } > release-notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "qin $GITHUB_REF_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              release-assets/* \
              --verify-tag \
              --title "qin $GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi
