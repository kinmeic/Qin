name: Republish OpenWrt 24 IPKs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  republish:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: v0.4.2
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install --yes minisign

      - name: Download current release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/qin-assets/current" "$RUNNER_TEMP/qin-assets/release"
          gh release download "$RELEASE_TAG" \
            --repo "$GH_REPO" \
            --pattern 'qin_*.ipk' \
            --dir "$RUNNER_TEMP/qin-assets/current"
          gh release download "$RELEASE_TAG" \
            --repo "$GH_REPO" \
            --dir "$RUNNER_TEMP/qin-assets/release"

      - name: Repack legacy IPKs with OpenWrt's outer format
        run: |
          unpacked="$RUNNER_TEMP/qin-assets/unpacked"
          release="$RUNNER_TEMP/qin-assets/release"
          mkdir -p "$unpacked"
          for original in "$RUNNER_TEMP/qin-assets/current"/qin_*.ipk; do
            name=$(basename "$original")
            package_dir="$unpacked/$name"
            mkdir -p "$package_dir"
            (cd "$package_dir" && ar x "$original")
            tar -C "$package_dir" --owner=0 --group=0 --numeric-owner --mtime='@0' \
              -czf "$release/$name" ./debian-binary ./control.tar.gz ./data.tar.gz
            tar -tzf "$release/$name" >/dev/null
            case "$(file -b "$release/$name")" in
              gzip\ compressed\ data*) ;;
              *) echo "unexpected package format: $name" >&2; exit 1 ;;
            esac
          done

      - name: Recalculate and sign release checksums
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          release="$RUNNER_TEMP/qin-assets/release"
          cd "$release"
          find . -maxdepth 1 -type f \( -name 'qin-*' -o -name 'qin_*' \) -print0 \
            | sort --zero-terminated \
            | xargs --null sha256sum \
            | sed 's#  \./#  #' > SHA256SUMS
          sha256sum --check SHA256SUMS
          test -n "$MINISIGN_SECRET_KEY"
          test -n "$MINISIGN_PASSWORD"
          install -m 0600 /dev/null "$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_PASSWORD" \
            | minisign -S -s "$RUNNER_TEMP/minisign.key" -m SHA256SUMS \
                -x SHA256SUMS.minisig -t "qin $RELEASE_TAG SHA256SUMS"

      - name: Replace affected release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release="$RUNNER_TEMP/qin-assets/release"
          gh release upload "$RELEASE_TAG" \
            "$release"/qin_*.ipk \
            "$release/SHA256SUMS" \
            "$release/SHA256SUMS.minisig" \
            --repo "$GH_REPO" \
            --clobber
