# qin configuration
# Prefer environment variables for secrets, for example:
#   export QIN_API_KEY="sk-..."

version = 1
default_model = "primary"

[models.primary]
base_url = "https://api.openai.com/v1"
api_style = "chat_completions"
model = "gpt-4o-mini"
# Model name used for context-compression summaries; reuses this entry's
# connection settings. Empty means the summary uses `model` above.
summary_model = ""
# Environment-variable name holding the API key, or the API key itself.
api_key_env = "QIN_API_KEY"
context_window = 128000
max_output_tokens = 8192
supports_tools = true
supports_native_search = false
stream = true

[embeddings]
# Embedding calls are only made when this is enabled AND storage.enabled=true.
enabled = false
base_url = "https://api.openai.com/v1"
model = "text-embedding-3-small"
api_key_env = "QIN_API_KEY"
dimensions = 1536
batch_size = 32
vector_encoding = "f32"

[agent]
max_iterations = 24
max_tool_calls = 80
wall_time_seconds = 900

[context]
compact_trigger_ratio = 0.9
reserve_output_tokens = 8192
reserve_safety_tokens = 2048
protect_recent_tokens = 16000
tool_result_max_tokens = 6000

[input]
fromfile_max_bytes = 1048576
# Optional AGENTS.md placed beside this configuration file is injected into
# the system prompt as project instructions. qin never creates the file;
# create it by hand when you want persistent per-profile instructions.
agents_md_max_bytes = 262144
allow_utf8_bom = true
reject_nul = true

[storage]
# When disabled, no SQLite database is used: a single session is kept in a
# JSON file on tmpfs (RAM-backed; /dev/shm or $XDG_RUNTIME_DIR on Linux,
# /tmp on OpenWrt), unless the optional Redis backend below is available.
# The session survives process restarts and is passed to the next run as
# context, "qin new" wipes it, and it disappears on reboot when using tmpfs.
# Embeddings, long-term memory, and cross-session recall stay disabled.
# data_dir overrides the session-file directory when set.
enabled = false
data_dir = ""
database = "qin.db"
journal_mode = "auto"
write_profile = "auto"
busy_timeout_ms = 5000

[storage.redis]
# When enabled and storage.enabled=false, qin first tries Redis and avoids
# writing qin-session.json. If Redis is unavailable, qin safely falls back to
# the tmpfs JSON session file and prints a warning.
enabled = false
url = "redis://127.0.0.1:6379/0"
# Prefer an environment variable when the URL contains a password or TLS
# settings, for example: QIN_REDIS_URL=redis://:password@host:6379/0
# url_env = "QIN_REDIS_URL"
# Redis stores conversation content; use a private/authenticated instance.
key_prefix = "qin"
connect_timeout_ms = 1000

[knowledge]
# Requires storage.enabled=true and embeddings.enabled=true to take effect.
enabled = true
recall_limit = 8
max_context_tokens = 2500
retrieval = "hybrid"
vector_weight = 0.70
keyword_weight = 0.20
importance_weight = 0.10
index_backend = "auto"
chunk_tokens = 600
chunk_overlap_tokens = 80
auto_extract = true
auto_extract_every_turns = 1
max_auto_memories_per_run = 3

[permissions]
approval = "on_risk"
workspace_write = true
allow_shell = true
elevation = "auto"
trash_instead_of_delete = true
command_timeout_seconds = 120
max_output_bytes = 1048576

[checkpoints]
# Snapshot files before typed file tools (write_file, apply_patch, move_path,
# copy_path, remove_path) mutate them, so "qin undo" can restore the previous
# state. Requires the SQLite storage backend; shell commands are not tracked.
# On OpenWrt flash storage, consider enabled = false to avoid extra writes.
enabled = true
max_file_bytes = 10485760
keep = 20

[search]
order = ["exa", "brave", "native"]
max_results = 8
timeout_seconds = 15

[search.exa]
enabled = false
api_key_env = "EXA_API_KEY"

[search.brave]
enabled = false
api_key_env = "BRAVE_API_KEY"

[search.native]
enabled = false
model = "primary"

[ui]
show_tool_events = true
show_commands = true
stream_command_output = true
command_heartbeat_seconds = 5
command_output_max_bytes = 262144
