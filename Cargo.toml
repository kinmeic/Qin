[package]
name = "qin"
version = "0.2.2"
edition = "2024"
rust-version = "1.85"
description = "Use natural language to operate Linux, macOS, and OpenWrt without memorizing commands or flags"
license = "Apache-2.0"
repository = "https://github.com/kinmeic/Qin"
readme = "README.md"
keywords = ["ai", "agent", "cli", "terminal", "openwrt"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
directories = "6"
futures-util = "0.3"
fs2 = "0.4"
half = { version = "2", features = ["serde"] }
hex = "0.4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "signal", "time"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
